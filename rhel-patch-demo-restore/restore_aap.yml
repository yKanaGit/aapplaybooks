---
- name: Validate or restore the RHEL patch demo
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../aap-config/current-settings.yml
    - aap-config/demo-vars.yml
  vars:
    restore_demo_mode: validate
  tasks:
    - name: Validate restore mode and resource counts
      ansible.builtin.assert:
        that:
          - restore_demo_mode in ['validate', 'dry-run', 'restore']
          - job_templates | length == 4
          - workflow.nodes | length == 3
          - workflow.links | length == 2
          - slack_workflow.nodes | length == 3
          - slack_workflow.links | length == 2
        quiet: true

    - name: Validate safe patch template defaults
      ansible.builtin.assert:
        that:
          - item.extra_vars.apply_patch is sameas false
        quiet: true
      loop: "{{ job_templates | selectattr('playbook', 'equalto', 'rhel_patch.yml') | list }}"
      loop_control:
        label: "{{ item.name }}"

    # Reuse the interactive backend. Its inputs and reports go directly to
    # the terminal, keeping credentials out of Ansible variables and output.
    - name: Validate the terminal device path for the interactive tool
      ansible.builtin.assert:
        that:
          - restore_demo_tty | default('') is match('^/dev/(ttys[0-9]+|pts/[0-9]+)$')
        fail_msg: 'Pass the terminal device as -e "restore_demo_tty=$(tty)".'
      when: restore_demo_mode != 'validate' and not ansible_check_mode

    - name: Run the interactive restore tool on the control node
      ansible.builtin.shell: >-
        test -c {{ restore_demo_tty | quote }} &&
        exec {{ ansible_playbook_python | quote }} -B
        {{ (playbook_dir ~ '/restore_demo.py') | quote }}
        {{ '--dry-run' if restore_demo_mode == 'dry-run' else '' }}
        <{{ restore_demo_tty | quote }} >{{ restore_demo_tty | quote }} 2>&1
      when: restore_demo_mode != 'validate' and not ansible_check_mode
      changed_when: restore_demo_mode == 'restore'
      no_log: true
