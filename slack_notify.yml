---
- name: Produce a simulated RHEL advisory event for Slack Bolt
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Validate the Controller job and demo event configuration
      ansible.builtin.assert:
        that:
          - awx_job_template_name | default('') == 'RHEL-Slack-Notification'
          - awx_job_id | default('') | string is match('^[1-9][0-9]{0,18}$')
          - demo_event is mapping
          - demo_event.keys() | list | sort == ['advisory', 'cve', 'hostname', 'severity', 'source']
          - demo_event.hostname is match('^[A-Za-z0-9][A-Za-z0-9.-]*$')
          - demo_event.hostname not in ['all', 'localhost', 'ungrouped']
          - demo_event.advisory is match('^RHSA-[0-9]{4}:[0-9]+$')
          - demo_event.cve is match('^CVE-[0-9]{4}-[0-9]+$')
          - demo_event.severity in ['Low', 'Moderate', 'Important', 'Critical']
          - demo_event.source in ['Red Hat Satellite (simulated)', 'Red Hat Lightspeed (simulated)']
        quiet: true

    - name: Save the public vulnerability event as a Controller job artifact
      ansible.builtin.set_stats:
        per_host: false
        aggregate: false
        data:
          # Build the whole mapping together so older Ansible versions preserve the integer.
          demo_vulnerability_event: >-
            {{
              {
                'schema': 1,
                'notification_job_id': awx_job_id | int,
                'event': demo_event | combine({'id': '%032x' | format(awx_job_id | int)})
              }
            }}
