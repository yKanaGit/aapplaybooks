---
- name: Send RHEL vulnerability approval request
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Send Slack approval message
      ansible.builtin.uri:
        url: "{{ lookup('env', 'SLACK_WEBHOOK_URL') }}"
        method: POST
        body_format: json
        body:
          text: "RHEL Security Patch Approval Demo"
          blocks:
            - type: header
              text:
                type: plain_text
                text: "RHEL 脆弱性対応【デモ】"

            - type: section
              text:
                type: mrkdwn
                text: |
                  *対象:* node1.example.com
                  *CVE:* CVE-2022-43552
                  *重要度:* Low
                  *RHSA:* RHSA-2023:7743
                  *更新:* curl / libcurl

                  HCCでの脆弱性検知を模擬しています。
                  パッチ適用を承認しますか？

            - type: actions
              elements:
                - type: button
                  text:
                    type: plain_text
                    text: "パッチ適用を承認"
                  style: primary
                  action_id: approve_patch
                  value: "RHSA-2023:7743"

                - type: button
                  text:
                    type: plain_text
                    text: "保留"
                  action_id: reject_patch
                  value: "RHSA-2023:7743"
        status_code: 200
      no_log: true
