
---
- name: Collect RHEL diagnostics
  hosts: ao-rhel9-test
  gather_facts: true
  become: false

  tasks:
    - name: Get uptime and load average
      ansible.builtin.command: uptime
      register: cpu
      changed_when: false

    - name: Get memory usage
      ansible.builtin.command: free -m
      register: memory
      changed_when: false

    - name: Get disk usage
      ansible.builtin.command: df -hP
      register: disk
      changed_when: false

    - name: Get failed services
      ansible.builtin.command: systemctl --failed --no-pager
      register: services
      changed_when: false
      failed_when: false

    - name: Get system warnings
      ansible.builtin.command:
        argv:
          - journalctl
          - -p
          - warning
          - -n
          - "30"
          - --no-pager
      register: logs
      changed_when: false
      failed_when: false

    - name: Get CPU vulnerability mitigation status
      ansible.builtin.shell: |
        for f in /sys/devices/system/cpu/vulnerabilities/*; do
          echo "$(basename "$f"): $(cat "$f")"
        done
      register: cpu_security
      changed_when: false

    - name: Get nm-cloud-setup service status
      ansible.builtin.command:
        argv:
          - systemctl
          - show
          - nm-cloud-setup.service
          - --property=ActiveState,SubState,Result
      register: cloud_setup
      changed_when: false

    - name: Check demo service state
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - ao-demo-app.service
      register: demo_service
      changed_when: false
      failed_when: false

    - name: Check demo HTTP endpoint
      ansible.builtin.uri:
        url: http://127.0.0.1:18080/
        method: GET
        status_code: 200
        timeout: 3
      register: demo_http
      changed_when: false
      failed_when: false

    - name: Export diagnostic data
      ansible.builtin.set_stats:
        data:
          diagnostics:
            hostname: "{{ inventory_hostname }}"
            os: "{{ ansible_distribution }}"
            version: "{{ ansible_distribution_version }}"
            cpu: "{{ cpu.stdout }}"
            memory: "{{ memory.stdout }}"
            disk: "{{ disk.stdout }}"
            failed_services: "{{ services.stdout }}"
            system_logs: "{{ logs.stdout }}"
            cpu_security: "{{ cpu_security.stdout }}"
            cloud_setup: "{{ cloud_setup.stdout }}"
        per_host: false
