
# Canonical definition for restore-demo.sh. Keep apply_patch false in both patch templates.
# Environment-specific values and secrets are supplied separately.

project:
  name: RHEL-Patch-Demo
  scm_type: git
  scm_branch: main
  scm_update_on_launch: false

target:
  hostname: node1.example.com
  advisory: RHSA-2023:7743
  cve: CVE-2022-43552
  severity: Low
  source: Red Hat Satellite (simulated)

job_templates:
  - name: RHEL-Patch-Check
    organization: Default
    job_type: run
    inventory: Workshop Inventory
    project: RHEL-Patch-Demo
    playbook: rhel_patch.yml
    execution_environment: Default execution environment
    credentials:
      - "Workshop Credential"  # 正式名称を要確認
    limit: node1.example.com
    become_enabled: true
    forks: 0
    job_slice_count: 1
    timeout: 0
    extra_vars:
      target_rhsa: "RHSA-2023:7743"
      apply_patch: false

  - name: RHEL-Patch-Apply
    organization: Default
    job_type: run
    inventory: Workshop Inventory
    project: RHEL-Patch-Demo
    playbook: rhel_patch.yml
    execution_environment: Default execution environment
    credentials:
      - "Workshop Credential"  # 正式名称を要確認
    limit: node1.example.com
    become_enabled: true
    forks: 0
    job_slice_count: 1
    timeout: 0
    extra_vars:
      target_rhsa: "RHSA-2023:7743"
      apply_patch: false

  - name: RHEL-Slack-Notification
    organization: Default
    job_type: run
    inventory: Slack-Notification-Inventory
    project: RHEL-Patch-Demo
    playbook: slack_notify.yml
    execution_environment: Default execution environment
    forks: 0
    job_slice_count: 1
    timeout: 0

workflow:
  name: RHEL-Patch-Workflow
  organization: Default

  nodes:
    - id: patch-check
      type: job_template
      template: RHEL-Patch-Check

    - id: patch-approval
      type: approval
      name: Approve RHEL Security Patch
      timeout: 3600  # 実際の設定値を要確認

    - id: patch-apply
      type: job_template
      template: RHEL-Patch-Apply

  links:
    - from: patch-check
      to: patch-approval
      condition: success

    - from: patch-approval
      to: patch-apply
      condition: success

slack_workflow:
  name: RHEL-Patch-Slack-Workflow
  nodes:
    - id: patch-check
      type: job_template
      template: RHEL-Patch-Check
    - id: patch-apply
      type: job_template
      template: RHEL-Patch-Apply
  links:
    - from: patch-check
      to: patch-apply
      condition: success
