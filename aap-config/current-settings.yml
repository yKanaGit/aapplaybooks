
# AAP demo environment configuration
# Secrets must not be stored here.

project:
  name: RHEL-Patch-Demo
  scm_type: git
  scm_branch: main

target:
  hostname: node1.example.com
  advisory: RHSA-2023:7743
  cve: CVE-2022-43552

job_templates:
  - name: RHEL-Patch-Check
    organization: Default
    job_type: run
    inventory: Workshop Inventory
    project: RHEL-Patch-Demo
    playbook: rhel_patch.yml
    execution_environment: Default execution environment
    credentials:
      - "Workshop Credential"  # 正式名称を要確認
    limit: node1.example.com
    become_enabled: true
    forks: 0
    job_slice_count: 1
    timeout: 0
    extra_vars:
      target_rhsa: "RHSA-2023:7743"
      apply_patch: false

  - name: RHEL-Patch-Apply
    organization: Default
    job_type: run
    inventory: Workshop Inventory
    project: RHEL-Patch-Demo
    playbook: rhel_patch.yml
    execution_environment: Default execution environment
    credentials:
      - "Workshop Credential"  # 正式名称を要確認
    limit: node1.example.com
    become_enabled: true
    forks: 0
    job_slice_count: 1
    timeout: 0
    extra_vars:
      target_rhsa: "RHSA-2023:7743"
      apply_patch: true
      
  - name: RHEL-Slack-Notification
    organization: Default
    job_type: run
    inventory: Slack-Notification-Inventory
    project: RHEL-Patch-Demo
    playbook: slack_notify.yml
    execution_environment: Default execution environment
    credentials:
      - Slack-Patch-Demo
    forks: 0
    job_slice_count: 1
    timeout: 0
    extra_vars: {}
    
workflow:
  name: RHEL-Patch-Workflow
  organization: Default

  nodes:
    - id: check
      type: job_template
      template: RHEL-Patch-Check

    - id: approval
      type: approval
      name: Approve RHEL Security Patch
      timeout: 3600  # 実際の設定値を要確認

    - id: apply
      type: job_template
      template: RHEL-Patch-Apply

  links:
    - from: check
      to: approval
      condition: success

    - from: approval
      to: apply
      condition: success
